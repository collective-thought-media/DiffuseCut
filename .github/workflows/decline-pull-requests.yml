name: Decline pull requests

# Solo-maintained release: forks welcome, upstream PRs are not reviewed.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = [
              "Thanks for your interest in DiffuseCut.",
              "",
              "This repository is maintained solo. Pull requests are not accepted here.",
              "You are welcome to fork and develop your own version.",
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_request_number: context.issue.number,
              state: "closed",
            });
